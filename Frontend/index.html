<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Usuarios</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Gestión de Usuarios</h1>
      <p>Frontend conectado a la API REST</p>
    </header>

    <section class="card">
      <h2 id="form-title">Crear usuario</h2>

      <form id="user-form">
        <input type="hidden" id="user-id" />

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ingrese el nombre" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Ingrese el email" required />
        </div>

        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" id="edad" placeholder="Ingrese la edad" min="1" required />
        </div>

        <div class="form-group checkbox-group">
          <label for="activo">Activo</label>
          <input type="checkbox" id="activo" />
        </div>

        <div class="buttons">
          <button type="submit" class="btn primary" id="save-btn">Guardar usuario</button>
          <button type="button" class="btn secondary hidden" id="cancel-btn">Cancelar edición</button>
        </div>
      </form>

      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Lista de usuarios</h2>
        <button class="btn primary" id="reload-btn">Recargar</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Edad</th>
              <th>Activo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr>
              <td colspan="6" class="empty">Cargando usuarios...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
